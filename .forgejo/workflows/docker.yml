---
name: Docker registry utilities

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: Utility to execute
        required: true
        type: choice
        options:
          - list_repositories
          - list_repositories_tags
          - determine_digest
          - delete_manifest
          - update_image
          - collect_garbage
      repo:
        description: Repository for tag/digest/manifest operations
        required: false
        default: ''
        type: string
      tag:
        description: Repository tag for determine_digest
        required: false
        default: ''
        type: string
      digest:
        description: Manifest digest for delete_manifest
        required: false
        default: ''
        type: string
      pull_image:
        description: Remote image for update_image
        required: false
        default: ''
        type: string
      local_tag:
        description: Local registry tag for update_image
        required: false
        default: ''
        type: string

jobs:
  utility:
    runs-on: forgejo-host
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6
      - name: Execute utility
        env:
          OPERATION: ${{ inputs.operation }}
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
          PULL_IMAGE: ${{ inputs.pull_image }}
          LOCAL_TAG: ${{ inputs.local_tag }}
          DOCKERHUB_URL: ${{ vars.DOCKERHUB_URL }}
        run: |
          set -eu
          case "$OPERATION" in
            list_repositories) curl -fsS "https://${DOCKERHUB_URL}/v2/_catalog" ;;
            list_repositories_tags) curl -fsS "https://${DOCKERHUB_URL}/v2/${REPO}/tags/list" ;;
            determine_digest) curl -fsS -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' -o /dev/null -w '%header{Docker-Content-Digest}' "https://${DOCKERHUB_URL}/v2/${REPO}/manifests/${TAG}" ;;
            delete_manifest) test -n "$REPO"; test -n "$DIGEST"; curl -fsS -X DELETE "https://${DOCKERHUB_URL}/v2/${REPO}/manifests/${DIGEST}" ;;
            update_image) test -n "$PULL_IMAGE"; test -n "$LOCAL_TAG"; docker pull "$PULL_IMAGE"; docker image tag "$PULL_IMAGE" "${DOCKERHUB_URL}/${LOCAL_TAG}"; docker push "${DOCKERHUB_URL}/${LOCAL_TAG}"; docker image rm "${DOCKERHUB_URL}/${LOCAL_TAG}" ;;
            collect_garbage) ansible-playbook services/dockerhub/ansible/dockerhub.yml --tags collect-garbage ;;
            *) echo "Unknown operation: $OPERATION" >&2; exit 2 ;;
          esac
