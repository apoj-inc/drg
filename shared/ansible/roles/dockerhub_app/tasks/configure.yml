---
- name: Render Docker Hub cache environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dockerhub_compose_dir }}/.env"
    mode: "0600"
  notify: Restart Docker Hub cache

- name: Copy Docker Hub cache registry configuration
  ansible.builtin.copy:
    src: config.yml
    dest: "{{ dockerhub_compose_dir }}/config.yml"
    mode: "0600"
  no_log: true
  notify: Restart Docker Hub cache

- name: Copy Docker Hub cache Compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ dockerhub_compose_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart Docker Hub cache
