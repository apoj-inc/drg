---
- name: Render OAuth2 Proxy Compose environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ oauth2_proxy_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart OAuth2 Proxy

- name: Render OAuth2 Proxy Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ oauth2_proxy_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart OAuth2 Proxy

- name: Validate OAuth2 Proxy Docker Compose file
  ansible.builtin.import_role:
    name: compose_app
    tasks_from: validate.yml
  vars:
    compose_app_root: "{{ oauth2_proxy_compose_dir }}"
