---
- name: Render OpenBao server configuration
  ansible.builtin.template:
    src: config.hcl.j2
    dest: "{{ openbao_compose_dir }}/config/config.hcl"
    owner: root
    group: root
    mode: "0644"
  notify: Restart OpenBao

- name: Render OpenBao Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ openbao_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Validate OpenBao Docker Compose file
  ansible.builtin.import_role:
    name: compose_app
    tasks_from: validate.yml
  vars:
    compose_app_root: "{{ openbao_compose_dir }}"
