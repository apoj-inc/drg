---
- name: Install Go toolchain prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download Go toolchain
  ansible.builtin.get_url:
    url: "{{ go_toolchain_tarball_url }}"
    dest: "{{ go_toolchain_tarball_dest }}"
    mode: '0644'
    checksum: "{{ (go_toolchain_tarball_checksum | length > 0) | ternary(go_toolchain_tarball_checksum, omit) }}"
  environment: "{{ external_download_environment }}"

- name: Create Go install directory
  ansible.builtin.file:
    path: "{{ go_toolchain_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install Go toolchain
  ansible.builtin.unarchive:
    src: "{{ go_toolchain_tarball_dest }}"
    dest: "{{ go_toolchain_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ go_toolchain_install_dir }}/bin/go"
