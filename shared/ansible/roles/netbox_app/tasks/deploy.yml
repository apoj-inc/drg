---
- name: Build NetBox image
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "{{ netbox_compose_dir }}"
  changed_when: true

- name: Recreate NetBox application containers
  community.docker.docker_compose_v2:
    project_src: "{{ netbox_compose_dir }}"
    state: present
    recreate: always
    services:
      - netbox
      - netbox-worker
      - netbox-housekeeping

- name: Start NetBox
  community.docker.docker_compose_v2:
    project_src: "{{ netbox_compose_dir }}"
    state: present
    remove_orphans: true
