---
grafana_install_method: "{{ grafana.install_method | default('docker') }}"
grafana_download_url: "{{ grafana.download_url | default(download_url | default('')) }}"

grafana_version: "{{ grafana.version | default('13.1.3') }}"
grafana_image: "{{ grafana.image | default('grafana/grafana:' ~ grafana_version) }}"
grafana_compose_dir: "{{ grafana.compose_dir | default('/opt/grafana') }}"
grafana_dashboards_source_dir: "{{ playbook_dir }}/../dashboards"
grafana_alerting_source_file: "{{ playbook_dir }}/../alerts/alerting.yml.j2"
grafana_listen_address: "{{ grafana.listen_address | default('0.0.0.0') }}"
grafana_http_port: "{{ grafana.http_port | default(3000) }}"
grafana_healthcheck_url: "http://127.0.0.1:{{ grafana_http_port }}/api/health"
grafana_root_url: "{{ grafana.root_url | default('http://localhost:' ~ grafana_http_port) }}"
grafana_metrics_enabled: "{{ grafana.metrics.enabled | default(true) | bool }}"
grafana_oidc_issuer_url: "{{ grafana.oidc.issuer_url | default('') }}"
grafana_oidc_endpoint_base_url: "{{ grafana.oidc.endpoint_base_url | default(grafana_oidc_issuer_url | regex_replace('/[^/]+/?$', '/')) }}"
grafana_oidc_client_id: "{{ grafana.oidc.client_id | default('grafana') }}"
grafana_oidc_client_secret: ""
grafana_oidc_allowed_groups: "{{ grafana.oidc.allowed_groups | default(['grafana-admins', 'grafana-viewers']) }}"
grafana_admin_password: ""
grafana_prometheus_image: "{{ monitoring.prometheus_image | default('prom/prometheus:v3.5.0') }}"
grafana_prometheus_gid: "65534"
grafana_blackbox_exporter_image: "{{ monitoring.blackbox_exporter_image | default('prom/blackbox-exporter:v0.27.0') }}"
grafana_pve_exporter_image: "{{ monitoring.pve_exporter_image | default('prompve/prometheus-pve-exporter:3.9.0') }}"
grafana_pve_exporter_gid: "101"
grafana_postgres_exporter_image: "{{ monitoring.postgres_exporter_image | default('prometheuscommunity/postgres-exporter:v0.17.1') }}"
grafana_redis_exporter_image: "{{ monitoring.redis_exporter_image | default('oliver006/redis_exporter:v1.88.0') }}"
grafana_prometheus_retention: "{{ monitoring.retention | default('30d') }}"
grafana_prometheus_scrape_interval: "{{ monitoring.scrape_interval | default('30s') }}"
grafana_loki_image: "{{ monitoring.logging.loki_image | default('grafana/loki:3.7.6') }}"
grafana_loki_http_port: "{{ monitoring.logging.http_port | default(3100) }}"
grafana_loki_retention: "{{ monitoring.logging.retention | default('336h') }}"
grafana_blackbox_targets: "{{ monitoring.blackbox.targets | default([]) }}"
grafana_proxmox_target: "{{ monitoring.proxmox.target | default('proxmox.example.test') }}"
grafana_proxmox_user: "{{ monitoring.proxmox.user | default('prometheus@pve') }}"
grafana_proxmox_token_name: "{{ monitoring.proxmox.token_name | default('monitoring') }}"
grafana_proxmox_verify_ssl: "{{ monitoring.proxmox.verify_ssl | default(true) | bool }}"
grafana_s3_endpoint: "{{ monitoring.s3.endpoint | default('') }}"
grafana_s3_bucket: "{{ monitoring.s3.bucket | default('') }}"
grafana_s3_region: "{{ monitoring.s3.region | default('us-east-1') }}"
grafana_s3_access_key: ""
grafana_s3_secret_key: ""
grafana_telegram_bot_token: ""
grafana_telegram_chat_id: ""
grafana_proxmox_api_token: ""
grafana_postgresql_host: "{{ monitoring.postgresql.host | default('postgresql.example.test') }}"
grafana_postgresql_port: "{{ monitoring.postgresql.port | default(5432) }}"
grafana_postgresql_username: "{{ monitoring.postgresql.username | default('prometheus') }}"
grafana_postgresql_password: ""
grafana_forgejo_metrics_token: ""
grafana_redis_exporter_password: ""
grafana_forgejo_metrics_port: "{{ monitoring.service_metrics.forgejo.port | default(3000) }}"
grafana_dockerhub_metrics_port: "{{ monitoring.service_metrics.dockerhub.port | default(5001) }}"
grafana_powerdns_authoritative_metrics_port: "{{ monitoring.service_metrics.powerdns.authoritative_port | default(8081) }}"
grafana_powerdns_recursor_metrics_port: "{{ monitoring.service_metrics.powerdns.recursor_port | default(8082) }}"
grafana_keycloak_metrics_port: "{{ monitoring.service_metrics.keycloak.port | default(9000) }}"
grafana_oauth2_proxy_metrics_port: "{{ monitoring.service_metrics.oauth2_proxy.port | default(44180) }}"

grafana_source_repo: "{{ grafana.source_repo | default('https://github.com/grafana/grafana.git') }}"
grafana_source_ref: "{{ grafana.source_ref | default('v' ~ grafana_version) }}"
grafana_source_dir: "{{ grafana.source_dir | default('/usr/local/src/grafana') }}"
grafana_source_force_checkout: "{{ grafana.source_force_checkout | default(false) }}"
grafana_source_rebuild: "{{ grafana.source_rebuild | default(false) }}"
grafana_build_command: "{{ grafana.build_command | default('corepack enable --install-directory /usr/local/bin\nyarn install --immutable\nmake build') }}"
grafana_go_version: "{{ grafana.go_version | default('1.26.5') }}"
grafana_go_install_dir: "/usr/local/go-{{ grafana_go_version }}"
grafana_go_tarball_url: "{{ grafana.go_tarball_url | default('https://go.dev/dl/go' ~ grafana_go_version ~ '.linux-amd64.tar.gz') }}"
grafana_go_tarball_checksum: "{{ grafana.go_tarball_checksum | default('') }}"
grafana_nodejs_major_version: "{{ grafana.nodejs_major_version | default(22) }}"
grafana_node_max_old_space_mb: "{{ grafana.node_max_old_space_mb | default(4096) }}"
grafana_build_environment:
  PATH: "{{ grafana_go_install_dir }}/bin:/usr/local/bin:/usr/bin:/bin"
  NODE_OPTIONS: "--max-old-space-size={{ grafana_node_max_old_space_mb }}"
  YARN_ENABLE_PROGRESS_BARS: "false"

grafana_user: grafana
grafana_group: grafana
grafana_config_dir: /etc/grafana
grafana_config_file: /etc/grafana/grafana.ini
grafana_data_dir: /var/lib/grafana
grafana_log_dir: /var/log/grafana
grafana_plugins_dir: /var/lib/grafana/plugins
grafana_provisioning_dir: /etc/grafana/provisioning
grafana_binary_path: "{{ grafana_source_dir }}/bin/grafana"
