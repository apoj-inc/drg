---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - adduser
      - libfontconfig1
      - musl
    state: present
    update_cache: true

- name: Download Grafana package
  ansible.builtin.get_url:
    url: "{{ grafana_download_url }}"
    dest: /tmp/grafana.deb
    mode: '0644'
    headers:
      User-Agent: "Debian APT-HTTP/1.3"
    validate_certs: true
  environment: "{{ external_download_environment }}"

- name: Install Grafana package
  ansible.builtin.apt:
    name: /tmp/grafana.deb
    state: present
