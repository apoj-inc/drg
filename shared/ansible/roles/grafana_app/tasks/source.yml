---
- name: Remove packaged Grafana
  ansible.builtin.apt:
    name:
      - grafana
      - grafana-enterprise
    state: absent

- name: Install source build packages
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - libfontconfig1
      - make
      - musl
      - python3
    state: present
    update_cache: true

- name: Install Node.js toolchain
  ansible.builtin.import_role:
    name: nodejs_toolchain
  vars:
    nodejs_toolchain_major_version: "{{ grafana_nodejs_major_version }}"

- name: Install Go toolchain
  ansible.builtin.import_role:
    name: go_toolchain
  vars:
    go_toolchain_version: "{{ grafana_go_version }}"
    go_toolchain_install_dir: "{{ grafana_go_install_dir }}"
    go_toolchain_tarball_url: "{{ grafana_go_tarball_url }}"
    go_toolchain_tarball_checksum: "{{ grafana_go_tarball_checksum }}"

- name: Ensure Grafana group exists
  ansible.builtin.group:
    name: "{{ grafana_group }}"
    system: true

- name: Ensure Grafana user exists
  ansible.builtin.user:
    name: "{{ grafana_user }}"
    group: "{{ grafana_group }}"
    home: "{{ grafana_data_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create Grafana runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ grafana_config_dir }}"
      owner: root
      group: "{{ grafana_group }}"
      mode: '0750'
    - path: "{{ grafana_provisioning_dir }}"
      owner: root
      group: "{{ grafana_group }}"
      mode: '0750'
    - path: "{{ grafana_data_dir }}"
      owner: "{{ grafana_user }}"
      group: "{{ grafana_group }}"
      mode: '0750'
    - path: "{{ grafana_log_dir }}"
      owner: "{{ grafana_user }}"
      group: "{{ grafana_group }}"
      mode: '0750'
    - path: "{{ grafana_plugins_dir }}"
      owner: "{{ grafana_user }}"
      group: "{{ grafana_group }}"
      mode: '0750'

- name: Check out Grafana source
  ansible.builtin.git:
    repo: "{{ grafana_source_repo }}"
    dest: "{{ grafana_source_dir }}"
    version: "{{ grafana_source_ref }}"
    force: "{{ grafana_source_force_checkout | bool }}"
    update: true
  environment: "{{ external_download_environment }}"
  register: grafana_source_checkout

- name: Check Grafana source binary
  ansible.builtin.stat:
    path: "{{ grafana_binary_path }}"
  register: grafana_source_binary

- name: Check Corepack availability
  ansible.builtin.command: corepack --version
  register: grafana_corepack_check
  changed_when: false
  failed_when: false

- name: Install Corepack
  ansible.builtin.command: npm install --global corepack
  when: grafana_corepack_check.rc != 0

- name: Ensure Corepack shim directory exists
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Build Grafana from source
  ansible.builtin.shell: |
    set -euo pipefail
    {{ grafana_build_command }}
  args:
    chdir: "{{ grafana_source_dir }}"
    executable: /bin/bash
  environment: "{{ grafana_build_environment }}"
  when: grafana_source_checkout.changed or not grafana_source_binary.stat.exists or grafana_source_rebuild | bool
  notify: Restart Grafana

- name: Install Grafana configuration
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_file }}"
    owner: root
    group: "{{ grafana_group }}"
    mode: '0640'
  notify: Restart Grafana

- name: Install Grafana source systemd unit
  ansible.builtin.template:
    src: grafana-server.service.j2
    dest: /etc/systemd/system/grafana-server.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Grafana
