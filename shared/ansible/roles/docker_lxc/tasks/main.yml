---
- name: Configure APT egress proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80-egress-proxy
    mode: "0644"
    content: |
      Acquire::ForceIPv4 "true";
      Acquire::https::Proxy "{{ platform_config.egress_proxy.https }}";
  when:
    - platform_config.egress_proxy is defined
    - platform_config.egress_proxy.https | default('') | length > 0

- name: Install Docker prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Remove conflicting distro Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
- name: Ensure Docker APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
- name: Download Docker official APT signing key
  ansible.builtin.command:
    argv:
      - curl
      - -fsSL
      - https://download.docker.com/linux/debian/gpg
      - -o
      - /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.asc
  environment: "{{ external_download_environment }}"
- name: Ensure Docker official APT signing key permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: file
    mode: "0644"
- name: Detect Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_deb_arch
  changed_when: false
- name: Add Docker official APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ docker_deb_arch.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_lxc_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 0
- name: Ensure Docker config directory exists
  ansible.builtin.file:
    path: "{{ docker_lxc_daemon_config_path | dirname }}"
    state: directory
    mode: "0755"
- name: Configure Docker storage driver for LXC
  ansible.builtin.copy:
    dest: "{{ docker_lxc_daemon_config_path }}"
    mode: "0644"
    content: |
      {
        "storage-driver": "{{ docker_lxc_storage_driver }}"{% if platform_config.egress_proxy is defined and platform_config.egress_proxy.https | default('') | length > 0 %},
        "proxies": {
          "https-proxy": "{{ platform_config.egress_proxy.https }}"
        }{% endif %}
      }
  notify: Restart Docker
- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
- name: Apply Docker configuration before verifying the daemon
  ansible.builtin.meta: flush_handlers
- name: Verify Docker uses configured storage driver
  ansible.builtin.command: docker info
  register: docker_info
  changed_when: false
  failed_when: "'Storage Driver: ' ~ docker_lxc_storage_driver not in docker_info.stdout"
