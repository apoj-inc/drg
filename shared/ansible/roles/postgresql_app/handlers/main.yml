---
- name: Restart PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: restarted
  when: not postgresql_patroni_enabled | bool

- name: Restart Patroni
  ansible.builtin.service:
    name: patroni
    state: restarted
  when: postgresql_patroni_enabled | bool

- name: Reload active PgBouncer primary
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - try-reload-or-restart
      - pgbouncer@primary.service
  changed_when: false
  when: postgresql_pgbouncer_enabled | bool

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
