---
- name: Install Node.js repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: '0644'
  environment: "{{ external_download_environment }}"

- name: Configure NodeSource repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ nodejs_toolchain_major_version }}.x
      Suites: nodistro
      Components: main
      Signed-By: /etc/apt/keyrings/nodesource.asc

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true
