---
- name: Validate Forgejo secrets
  ansible.builtin.assert:
    that:
      - forgejo_postgresql_password | length > 0
      - forgejo_secret_key | length > 0
      - forgejo_internal_token | length > 0
      - forgejo_s3_access_key | length > 0
      - forgejo_s3_secret_key | length > 0
      - forgejo_oidc_client_secret | length > 0
    fail_msg: "Forgejo secrets must be supplied through OpenBao environment variables."
  no_log: true

- name: Ensure Forgejo directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('1000') }}"
    group: "{{ item.group | default('1000') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - {path: "{{ forgejo_compose_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ forgejo_data_dir }}"}
    - {path: "{{ forgejo_data_dir }}/gitea/conf"}
    - {path: "{{ forgejo_data_dir }}/gitea/log"}
    - {path: "{{ forgejo_repository_root }}"}

- name: Ensure Forgejo repositories are writable by the Forgejo service user
  ansible.builtin.file:
    path: "{{ forgejo_repository_root }}"
    owner: "1000"
    group: "1000"
    recurse: true

- name: Render Forgejo app.ini
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ forgejo_data_dir }}/gitea/conf/app.ini"
    owner: "1000"
    group: "1000"
    mode: "0640"
  no_log: true
  notify: Restart Forgejo

- name: Render Forgejo environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ forgejo_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Forgejo

- name: Render Forgejo Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Forgejo

- name: Start Forgejo
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_compose_dir }}"
    state: present
    pull: missing
  when: not forgejo_managed_by_ha | bool

- name: Apply pending Forgejo configuration changes
  ansible.builtin.meta: flush_handlers

- name: Restart Forgejo before authenticated metrics verification
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_compose_dir }}"
    services:
      - forgejo
    state: restarted
  when: not forgejo_managed_by_ha | bool

- name: Wait for Forgejo health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/healthz"
    status_code: [200, 401, 404]
  register: forgejo_health
  until: forgejo_health.status in [200, 401, 404]
  retries: 30
  delay: 5
  when: not forgejo_managed_by_ha | bool

- name: Verify Forgejo Prometheus metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/metrics"
    headers:
      Authorization: "Bearer {{ forgejo_internal_token }}"
    return_content: false
    status_code: 200
  no_log: true
  when: not forgejo_managed_by_ha | bool

- name: Read Forgejo authentication sources
  ansible.builtin.shell: >-
    docker compose -f {{ forgejo_compose_dir }}/docker-compose.yml exec -T --user git forgejo
    forgejo admin auth list
  register: forgejo_auth_sources
  changed_when: false
  failed_when: false
  no_log: true
  when: not forgejo_managed_by_ha | bool

- name: Configure Forgejo Authentik OIDC source
  ansible.builtin.shell: >-
    docker compose -f {{ forgejo_compose_dir }}/docker-compose.yml exec -T --user git forgejo
    forgejo admin auth add-oauth
    --name "{{ forgejo_oidc_provider_name }}"
    --provider openidConnect
    --key "{{ forgejo_oidc_client_id }}"
    --secret "$OIDC_CLIENT_SECRET"
    --auto-discover-url "{{ forgejo_oidc_issuer_url }}"
    --scopes openid
    --scopes profile
    --scopes email
  environment:
    OIDC_CLIENT_SECRET: "{{ forgejo_oidc_client_secret }}"
  when:
    - not forgejo_managed_by_ha | bool
    - forgejo_oidc_enabled | bool
    - forgejo_oidc_provider_name not in (forgejo_auth_sources.stdout | default(''))
  changed_when: true
  no_log: true

- name: Update existing Forgejo Authentik OIDC source
  ansible.builtin.shell: >-
    docker compose -f {{ forgejo_compose_dir }}/docker-compose.yml exec -T --user git forgejo
    forgejo admin auth update-oauth
    --id "$(printf '%s\n' "$AUTH_SOURCES" | awk '$2 == "{{ forgejo_oidc_provider_name }}" { print $1; exit }')"
    --name "{{ forgejo_oidc_provider_name }}"
    --provider openidConnect
    --key "{{ forgejo_oidc_client_id }}"
    --secret "$OIDC_CLIENT_SECRET"
    --auto-discover-url "{{ forgejo_oidc_issuer_url }}"
    --scopes openid
    --scopes profile
    --scopes email
  environment:
    AUTH_SOURCES: "{{ forgejo_auth_sources.stdout | default('') }}"
    OIDC_CLIENT_SECRET: "{{ forgejo_oidc_client_secret }}"
  when:
    - not forgejo_managed_by_ha | bool
    - forgejo_oidc_enabled | bool
    - forgejo_oidc_provider_name in (forgejo_auth_sources.stdout | default(''))
  changed_when: true
  no_log: true
