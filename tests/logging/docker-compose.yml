---
services:
  grafana:
    image: grafana/grafana:13.1.3
    container_name: logging-test-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.6
    container_name: logging-test-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: [CMD, /usr/bin/loki, -config.file=/etc/loki/loki.yml, -verify-config]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: logging-test-alloy
    restart: unless-stopped
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy

  log-generator:
    image: alpine:3.22
    container_name: logging-test-generator
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "local logging smoke test timestamp=$$(date -Iseconds) level=info"
          sleep 2
        done

volumes:
  grafana-data:
  loki-data:
  alloy-data:
