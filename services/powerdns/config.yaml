---
service:
  name: powerdns
  topology: replicated
  description: PowerDNS Authoritative DNS with PostgreSQL backend and octoDNS sync.
  tags: [opentofu, powerdns, dns]

startup:
  order: 40

placement:
  clusters:
    example-cluster:
      nodes:
        pve-node-a:
          replicas_by_contour:
            A: 1
            B: 1

rollout:
  by_contour: true

instance:
  vm_id_ranges:
    example-cluster:
      A:
        start: 1006
      B:
        start: 1016

container:
  template:
    path: local:vztmpl
    name: debian-13-standard_13.6-1_amd64.tar.zst
  dns_servers: [198.51.100.100, 198.51.100.101, 192.0.2.14, 1.1.1.1, 8.8.8.8, 77.88.8.8]
  features:
    nesting: true
    keyctl: false
    fuse: false

compute:
  cpu_cores: 2
  memory_mb: 1024
  swap_mb: 512
  disk_gb: 20

network:
  interfaces:
    - name: net0
      network: app
      mode: static
      address_by_contour:
        A: 198.51.100.100/24
        B: 198.51.100.101/24
      role: dns
      dns_name_pattern: powerdns-%{cluster}-%{contour}-%02d
      ansible_primary: true

dns:
  canonical_name: powerdns.example.test
  zone: example.test
  ttl: 60
  routing:
    mode: direct
    publish_after_healthcheck: true
    direct:
      record_type: A

powerdns:
  image_tag: 4.9.15
  listen_address: 0.0.0.0
  dns_port: 53000
  api_address: 0.0.0.0
  api_port: 8081
  monitoring_allowed_cidrs: [198.51.100.0/24]
  recursor:
    image_tag: 5.4.0
    listen_address: 0.0.0.0
    dns_port: 53053
    metrics_port: 8082
    default_dns: 1.1.1.1;8.8.8.8;77.88.8.8
  dnsdist:
    image_tag: 1.9.7
    listen_address: 0.0.0.0
    dns_port: 53
  local_zone: example.test
  static_allow_from: [127.0.0.0/8, 172.0.0.0/8, 192.0.2.0/24, 198.51.100.0/24]
  host_entries:
    - address: 198.51.100.3
      names:
        - postgresql.example.test
        - postgresql
  postgresql:
    host: postgresql.example.test
    address: 198.51.100.3
    port: 5432
    database: powerdns
    username: powerdns

secrets:
  path: kv/services/powerdns
  fields:
    - powerdns_api_key
    - powerdns_postgresql_password

freeipa_client:
  hostgroups: [service-powerdns]
