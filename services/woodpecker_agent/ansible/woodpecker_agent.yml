---
- name: Deploy Woodpecker execution agent
  hosts: "{{ lookup('env', 'ANSIBLE_LIMIT') | default('woodpecker-agent', true) }}"
  become: true
  gather_facts: false

  vars_files:
    - ../config.yaml

  vars:
    woodpecker_agent_version: "{{ woodpecker_agent.version }}"
    woodpecker_agent_server: "{{ woodpecker_agent.server }}"
    woodpecker_agent_api_url: "{{ woodpecker_agent.api_url }}"
    woodpecker_agent_api_token: "{{ lookup('env', 'WOODPECKER_API_TOKEN') }}"
    woodpecker_agent_organization: "{{ woodpecker_agent.organization }}"
    woodpecker_agent_name: "{{ inventory_hostname }}"
    woodpecker_agent_grpc_secure: "{{ woodpecker_agent.grpc_secure | default(false) }}"
    woodpecker_agent_dagger_version: "{{ woodpecker_agent.dagger_version }}"
    woodpecker_agent_plugin_git_version: "{{ woodpecker_agent.plugin_git_version }}"
    woodpecker_agent_max_workflows: "{{ woodpecker_agent.max_workflows }}"
    woodpecker_agent_contour: "{{ lookup('env', 'DEPLOYMENT_CONTOUR') | upper }}"
    woodpecker_agent_rollout_contours: "{{ woodpecker_platform.rollout_contours.keys() | list }}"

  pre_tasks:
    - ansible.builtin.import_tasks: ../../../shared/ansible/tasks/bootstrap_python.yml
    - name: Load platform rollout contour definitions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../environments/example/platform.yaml"
        name: woodpecker_platform

  roles:
    - woodpecker_agent_app
    - monitoring_agent
    - logging_agent
