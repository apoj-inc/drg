---
service:
  name: woodpecker-agent
  topology: replicated
  description: Woodpecker local Dagger execution agents.
  tags: [opentofu, woodpecker-agent, woodpecker, dagger]

rollout:
  by_contour: true

startup:
  order: 176

logging:
  journal_units:
    - woodpecker-agent

placement:
  clusters:
    example-cluster:
      nodes:
        pve-node-a:
          replicas_by_contour:
            A: 1
            B: 1

instance:
  vm_id_ranges:
    example-cluster:
      A: {start: 1402}
      B: {start: 1403}

compute:
  cpu_cores: 4
  memory_mb: 8192
  swap_mb: 1024
  disk_gb: 40

container:
  template:
    path: local:vztmpl
    name: debian-13-standard_13.6-1_amd64.tar.zst
  features:
    nesting: true
    keyctl: false
    fuse: false

network:
  interfaces:
    - name: net0
      network: app
      mode: netbox
      dns_name_pattern: woodpecker-agent-%{cluster}-%{contour}-%02d
      role: app
      ansible_primary: true

dns:
  canonical_name: woodpecker-agents.example.test
  zone: example.test
  ttl: 60
  routing:
    mode: direct
    publish_after_healthcheck: true
    direct:
      record_type: A

woodpecker_agent:
  version: 3.18.0
  server: ci.example.test:9000
  api_url: https://ci.example.test
  organization: example-org
  grpc_secure: false
  dagger_version: 0.21.0
  plugin_git_version: 2.10.0
  max_workflows: 4

secrets:
  path: kv/services/woodpecker
  fields:
    - woodpecker_api_token

freeipa_client:
  hostgroups: [service-woodpecker-agent]
