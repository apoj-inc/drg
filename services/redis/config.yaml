---
service:
  name: redis
  topology: clustered
  description: Three-node Redis HA cluster with Sentinel and Traefik role-aware health checks.
  tags:
    - opentofu
    - redis
    - traefik-managed-route
    - database

startup:
  order: 30

logging:
  journal_units:
    - redis-sentinel
    - redis-server

rollout:
  by_contour: true

placement:
  clusters:
    example-cluster:
      nodes:
        pve-node-a:
          replicas_by_contour:
            A: 1
            B: 1
            C: 1

instance:
  vm_id_ranges:
    example-cluster:
      A:
        start: 1220
      B:
        start: 1221
      C:
        start: 1222

compute:
  cpu_cores: 2
  memory_mb: 2048
  disk_gb: 20

container:
  template:
    path: local:vztmpl
    name: debian-13-standard_13.6-1_amd64.tar.zst
  features:
    nesting: true
    keyctl: false
    fuse: false

network:
  interfaces:
    - name: net0
      network: app
      mode: netbox
      dns_name_pattern: redis-%{cluster}-%{contour}-%02d
      role: database
      ansible_primary: true

dns:
  canonical_name: redis.example.test
  zone: example.test
  ttl: 60
  routing:
    mode: ingress
    ingress_service: traefik

redis:
  port: 6379
  sentinel_port: 26379
  listen_address: 0.0.0.0
  data_dir: /var/lib/redis
  sentinel_data_dir: /var/lib/redis-sentinel
  master_name: drg-redis
  quorum: 2
  down_after_milliseconds: 5000
  failover_timeout: 60000
  parallel_syncs: 1

secrets:
  path: kv/services/redis
  fields:
    - redis_password

freeipa_client:
  hostgroups: [service-redis]
