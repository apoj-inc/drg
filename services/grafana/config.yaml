---
service:
  name: grafana
  topology: replicated
  description: Grafana application service.
  tags:
    - opentofu
    - grafana
    - traefik-managed-route

startup:
  order: 160

rollout:
  by_contour: true

placement:
  clusters:
    example-cluster:
      nodes:
        pve-node-a:
          replicas_by_contour:
            A: 1

instance:
  hostname_pattern: grafana-%{cluster}-%{contour}-%02d
  vm_id_ranges:
    example-cluster:
      A:
        start: 1200

container:
  template:
    path: local:vztmpl
    name: debian-13-standard_13.6-1_amd64.tar.zst
  features:
    nesting: true
    keyctl: false
    fuse: false

compute:
  cpu_cores: 2
  memory_mb: 4096
  swap_mb: 1024
  disk_gb: 100

network:
  interfaces:
    - name: net0
      network: app
      mode: netbox
      dns_name_pattern: grafana-%{cluster}-%{contour}-%02d
      role: app
      ansible_primary: true

dns:
  canonical_name: grafana.example.test
  zone: example.test
  ttl: 60
  routing:
    mode: ingress
    ingress_service: traefik

grafana:
  install_method: docker
  version: 13.1.3
  image: grafana/grafana:13.1.3
  compose_dir: /opt/grafana
  listen_address: 0.0.0.0
  http_port: 3000
  download_url: https://dl.grafana.com/grafana/release/13.1.3/grafana_13.1.3_31135815010_linux_amd64.deb
  root_url: https://grafana.example.test
  metrics:
    enabled: true
  oidc:
    issuer_url: https://auth.example.test/application/o/grafana/
    client_id: grafana
    allowed_groups: [grafana-admins, grafana-viewers]

monitoring:
  prometheus_image: prom/prometheus:v3.5.0
  blackbox_exporter_image: prom/blackbox-exporter:v0.27.0
  pve_exporter_image: prompve/prometheus-pve-exporter:3.9.0
  postgres_exporter_image: prometheuscommunity/postgres-exporter:v0.17.1
  redis_exporter_image: oliver006/redis_exporter:v1.88.0
  retention: 30d
  scrape_interval: 30s
  logging:
    loki_image: grafana/loki:3.7.6
    http_port: 3100
    retention: 336h
  service_metrics:
    forgejo:
      port: 3000
    dockerhub:
      port: 5001
    powerdns:
      authoritative_port: 8081
      recursor_port: 8082
    keycloak:
      port: 9000
    oauth2_proxy:
      port: 44180
  blackbox:
    targets:
      - https://grafana.example.test
      - https://auth.example.test
      - https://keycloak.example.test
      - https://ipa.example.test
      - https://proxmox.example.test
      - https://openbao.example.test
      - https://netbox.example.test
      - https://git.example.test
      - https://forge.example.test
      - https://dockerhub.example.test
      - https://powerdns.example.test
      - https://s3.example.test
      - https://ca.example.test/health
  s3:
    endpoint: https://s3.example.test
    bucket: grafana-prometheus-snapshots
    region: us-east-1
  proxmox:
    target: proxmox.example.test:443
    verify_ssl: true
  postgresql:
    host: postgresql.example.test
    port: 5432
    username: prometheus
  openbao:
    api_url: https://openbao.example.test

secrets:
  path: kv/services/grafana
  fields:
    - grafana_oidc_client_secret
    - grafana_admin_password
    - grafana_s3_access_key
    - grafana_s3_secret_key
    - grafana_telegram_bot_token
    - grafana_telegram_chat_id
    - grafana_proxmox_api_token
    - postgresql_prometheus_password
secret_imports:
  - path: kv/services/forgejo
    fields:
      - forgejo_internal_token
  - path: kv/services/redis
    fields:
      - redis_password

freeipa_client:
  hostgroups: [service-grafana]
