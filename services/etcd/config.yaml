---
service:
  name: etcd
  topology: clustered
  description: Three-node etcd quorum for PostgreSQL Patroni DCS.
  tags:
    - opentofu
    - etcd

startup:
  order: 10

logging:
  journal_units:
    - etcd

rollout:
  by_contour: true

placement:
  clusters:
    example-cluster:
      nodes:
        pve-node-a:
          replicas_by_contour:
            A: 1
            B: 1
            C: 1

instance:
  vm_id_ranges:
    example-cluster:
      A:
        start: 1200
      B:
        start: 1204
      C:
        start: 1205

container:
  template:
    path: local:vztmpl
    name: debian-13-standard_13.6-1_amd64.tar.zst
  features:
    nesting: true

etcd_cluster_members_config:
  - etcd-node-a
  - etcd-node-b
  - etcd-node-c

compute:
  cpu_cores: 2
  memory_mb: 2048
  disk_gb: 20

network:
  interfaces:
    - name: net0
      network: app
      mode: netbox
      dns_name_pattern: etcd-%{cluster}-%{contour}-%02d
      role: dcs
      ansible_primary: true

dns:
  canonical_name: etcd.example.test
  zone: example.test
  ttl: 60
  routing:
    mode: direct
    publish_after_healthcheck: true
    direct:
      record_type: A

etcd:
  client_port: 2379
  peer_port: 2380
  listen_address: 0.0.0.0
  data_dir: /var/lib/etcd/default

freeipa_client:
  hostgroups: [service-etcd]
